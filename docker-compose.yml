services:
  app:
    image: ghcr.io/baoxinwen/ledger:latest
    # missing：本地已有镜像时不再强制联网拉取（离线/限流时 up 仍可用本地镜像应急启动）；
    # 日常更新走 README 约定的 docker compose pull && docker compose up -d。
    pull_policy: missing
    ports:
      - "3000:3000"
    volumes:
      # 数据和备份目录属主由容器 entrypoint 在启动时自动修正为 node（uid 1000），无需手动 chown。
      - ./data:/app/server/data
      - ./backups:/app/server/backups
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=Asia/Shanghai
      # 部署在 Nginx 等反向代理后时设置可信代理，推荐用反代层数（如 1）而非 true：
      # 信任全部跳数（true）时若 3000 端口可被绕过反代直连，攻击者能伪造 X-Forwarded-For 重置登录限流。
      # - TRUST_PROXY=1
      # HTTPS 部署时启用 Secure Cookie，会话 Cookie 只走加密连接。
      # - COOKIE_SECURE=true
    security_opt:
      # entrypoint 以 root 启动后经 gosu 降权到 node，禁止进程再获取额外特权。
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
