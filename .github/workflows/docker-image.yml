name: Build Docker Image

on:
  push:
    branches:
      - main
  workflow_dispatch:

# 同一分支只保留一条最新流水线：避免连续合并时多个 build 并发竞争覆盖 latest 标签。
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/baoxinwen/ledger

# 顶层兜底：未显式声明 permissions 的 job 一律无权限，防止未来新增 job 落入仓库默认权限。
permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    # 显式超时：默认 360 分钟上限内挂起的 job 会持续占用 runner。
    timeout-minutes: 20
    # 测试任务只需要读代码权限，不授予任何写权限（最小权限原则）。
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install and test server
        working-directory: server
        run: |
          npm ci
          npm test

      - name: Install, lint, test and build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

  e2e:
    name: Run e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies and Playwright browser
        working-directory: client
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # e2e 自包含：Playwright 配置会自动拉起隔离后端（临时数据库 + 已知初始化 Token）与前端。
      - name: Run Playwright e2e
        working-directory: client
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 7

  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
